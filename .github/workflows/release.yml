name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false   # npm advises against caching in release builds

      - run: npm ci

      - name: Check the tag matches the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm run typecheck

      - run: npm test

      - name: Prove the loop still runs end to end
        run: npm run selftest

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
